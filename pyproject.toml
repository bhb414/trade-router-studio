[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-router-studio"
version = "0.1.4"
description = "Local web strategy studio powered by Trade Router"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "packaging>=24,<27",
  "platformdirs>=4.3,<5",
  "pydantic>=2.9,<3",
  "rich>=13.9,<15",
  "trade-router>=0.1.0",
  "typer>=0.15,<1",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]
build = ["build>=1.2,<2", "pyinstaller>=6.11,<7"]

[project.scripts]
trade-studio = "trade_router_studio.cli:app"
trade-studio-desktop = "trade_router_studio.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trade_router_studio = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "../trade-router/src"]
testpaths = ["tests"]
