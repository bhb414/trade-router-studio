name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out Studio
        uses: actions/checkout@v4

      - name: Check out Trade Router
        uses: actions/checkout@v4
        with:
          repository: bhb414/trade-router
          path: trade-router

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test
        shell: pwsh
        run: |
          python -m pip install ./trade-router
          python -m pip install ".[dev,build]"
          python -m ruff check .
          python -m pytest -q

      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = python -c "from trade_router_studio.version import __version__; print(__version__)"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version"
          }

      - name: Build Windows package
        shell: pwsh
        run: ./scripts/build-release.ps1 -RouterSource ./trade-router -Python python

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeRouterStudio-windows-x64
          path: |
            release/TradeRouterStudio-windows-x64.zip
            release/TradeRouterStudio-windows-x64.zip.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "release/TradeRouterStudio-windows-x64.zip" `
            "release/TradeRouterStudio-windows-x64.zip.sha256" `
            --repo "$env:GITHUB_REPOSITORY" `
            --verify-tag --generate-notes --title "Trade Router Studio $env:GITHUB_REF_NAME"
